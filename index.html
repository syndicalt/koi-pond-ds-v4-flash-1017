<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131a1c" />
    <title>Cozy Koi Pond</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="pond" aria-label="A koi pond at dusk"></canvas>
    <div class="veil" aria-hidden="true"></div>
    <header class="hud">
      <h1>Koi Pond</h1>
      <p class="hint">Drag to look around &middot; scroll to lean in &middot; tap the water to feed</p>
    </header>
    <div class="footer">
      <button id="feed" type="button">Feed the koi</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
    <noscript>This pond needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
